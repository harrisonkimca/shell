name: CI
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.23'
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: error
  ci:
    if: ${{ always() }}
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.23'
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_ci.py
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
