name: CI
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to verify cumulatively
        required: true
        type: string
      expected_main_sha:
        description: Exact final main revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.8'
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: quality-reports
          path: reports/quality.xml
          if-no-files-found: error
  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.8'
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/trivy
          key: trivy-0.76.2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trivy-0.76.2-${{ runner.os }}-
      - run: uv sync --locked
      - run: uv run --locked python scripts/images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: stack-reports
          path: reports/stack.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: image-evidence
          path: reports/images
          if-no-files-found: error
  requirements:
    if: ${{ always() }}
    needs: [quality, stack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.8'
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-reports
          path: reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stack-reports
          path: reports
      - run: uv run --locked python scripts/check_requirements.py
  ci:
    if: ${{ always() }}
    needs: [quality, stack, requirements]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.8'
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_ci.py --aggregate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
