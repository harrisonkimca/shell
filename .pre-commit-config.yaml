repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: import-linter
        name: Import contracts
        entry: env PYTHONPATH=apps/api/src:. uv run --locked lint-imports
        language: system
        pass_filenames: false
        always_run: true
