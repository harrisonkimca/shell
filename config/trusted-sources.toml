# Exact repositories, not registry-wide trust. Tools/Actions are pinned separately.
image-repositories = [
  "docker.io/library/python",
  "docker.io/library/caddy",
  "docker.io/library/postgres",
  "docker.io/library/redis",
  "docker.io/axllent/mailpit",
  "ghcr.io/astral-sh/uv",
]
package-indexes = ["https://pypi.org/simple"]
distribution-prefixes = ["https://files.pythonhosted.org/packages/"]
